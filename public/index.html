<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mappy - The efficient, fast geographer.</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:#f5f7fb;color:#172033}header{padding:20px 24px;background:#fff;border-bottom:1px solid #e7eaf0;display:flex;justify-content:space-between}.logo{font-size:25px;font-weight:800}.badge{font-size:12px;padding:6px 9px;border-radius:99px;background:#eef2ff;color:#4655c7}main{display:grid;grid-template-columns:420px 1fr;height:calc(100vh - 70px)}aside{background:#fff;border-right:1px solid #e7eaf0;padding:18px;overflow:auto}#map{height:100%}textarea,input,select,button{font:inherit}textarea{width:100%;min-height:88px;border:1px solid #d9deea;border-radius:14px;padding:12px;resize:vertical}select,input{width:100%;padding:10px;border:1px solid #d9deea;border-radius:11px;background:#fff}button{width:100%;border:0;border-radius:12px;padding:12px;background:#172033;color:#fff;font-weight:700;cursor:pointer;margin-top:10px}.card{border:1px solid #e4e7ee;border-radius:15px;padding:13px;margin-top:10px}.card h3{margin:0 0 5px;font-size:16px}.meta,.status{font-size:12px;color:#687386}.reason{font-size:12px;margin-top:7px;color:#33415c}.score{float:right;font-weight:800}.intent{margin:12px 0;padding:11px;border-radius:13px;background:#f5f7ff;font-size:12px;color:#4c5872}.chip{display:inline-block;background:#edf1f7;border-radius:99px;padding:4px 7px;margin:3px 3px 0 0}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}a{color:#4c5bd5;text-decoration:none}@media(max-width:850px){main{grid-template-columns:1fr;height:auto}#map{height:55vh}aside{border:0;border-bottom:1px solid #e7eaf0}}</style></head>
<body><header><div class="logo">mappy. <span class="badge">v0.4</span></div><div class="meta">The efficient, fast geographer.</div></header><main><aside>
<label class="meta">Where?</label><select id="location"><option value="my">My location</option><option value="nyc">New York City</option><option value="london">London</option><option value="custom">Custom coordinates</option></select>
<div id="custom" class="row" style="display:none;margin-top:8px"><input id="lat" placeholder="Latitude"><input id="lon" placeholder="Longitude"></div>
<label class="meta" style="display:block;margin-top:12px">What are you looking for?</label><textarea id="query" placeholder="quiet café with Wi-Fi where I can study for 3 hours"></textarea><button id="go">Find places</button>
<div id="status" class="status" style="margin-top:10px"></div><div id="intent"></div><div id="results"></div></aside><div id="map"></div></main>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const map = L.map("map").setView([40.7128,-74.006],13);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{attribution:"© OpenStreetMap contributors"}).addTo(map);

const $ = id => document.getElementById(id);
const locationSelect = $("location");
const customBox = $("custom");
const latInput = $("lat");
const lonInput = $("lon");
const queryInput = $("query");
const goButton = $("go");
const statusEl = $("status");
const intentEl = $("intent");
const resultsEl = $("results");
let markers=[];

const presets={nyc:[40.7128,-74.006],london:[51.5074,-0.1278]};

locationSelect.addEventListener("change",()=>{
  customBox.style.display = locationSelect.value==="custom" ? "grid" : "none";
});

function getSearchLocation(){
  const choice=locationSelect.value;
  if(presets[choice]) return Promise.resolve(presets[choice]);

  if(choice==="custom"){
    const lat=Number(latInput.value), lon=Number(lonInput.value);
    if(Number.isFinite(lat)&&Number.isFinite(lon)) return Promise.resolve([lat,lon]);
    return Promise.reject(new Error("Enter valid custom coordinates."));
  }

  return new Promise((resolve,reject)=>{
    if(!navigator.geolocation){
      reject(new Error("Geolocation is unavailable. Choose New York City, London, or Custom coordinates."));
      return;
    }
    navigator.geolocation.getCurrentPosition(
      p=>resolve([p.coords.latitude,p.coords.longitude]),
      ()=>reject(new Error("Location unavailable. Choose New York City, London, or Custom coordinates.")),
      {enableHighAccuracy:false,timeout:10000,maximumAge:300000}
    );
  });
}

function escapeHtml(value){
  return String(value??"").replace(/[&<>"']/g,c=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}

function clearMarkers(){
  markers.forEach(marker=>map.removeLayer(marker));
  markers=[];
}

function addMarker(coords,popup){
  const marker=L.marker(coords).addTo(map).bindPopup(popup);
  markers.push(marker);
  return marker;
}

function addLocationMarker(coords){
  const marker=L.circleMarker(coords,{radius:7}).addTo(map).bindPopup("Search location");
  markers.push(marker);
  return marker;
}

function renderResults(data,searchLocation){
  clearMarkers();
  map.setView(searchLocation,13);
  addLocationMarker(searchLocation);

  const chips=data.intent.categories.map(x=>`<span class="chip">${escapeHtml(x)}</span>`).join("");
  const extras=[
    data.intent.wifi?"Wi-Fi":"",
    data.intent.study?"study":"",
    data.intent.work?"work":"",
    data.intent.quiet?"quiet":"",
    data.intent.outdoor?"outdoors":"",
    data.intent.budget!=="any"?data.intent.budget:""
  ].filter(Boolean).map(x=>`<span class="chip">${escapeHtml(x)}</span>`).join("");

  intentEl.innerHTML=`<div class="intent"><b>Mappy understood:</b><br>${chips}${extras}</div>`;
  statusEl.textContent=`Found ${data.candidateCount} candidates, then ranked and diversified them.`;

  resultsEl.innerHTML=data.results.map((place,index)=>{
    addMarker(
      [place.lat,place.lon],
      `<b>${escapeHtml(place.name)}</b><br>${place.distanceKm} km`
    );
    return `<div class="card">
      <span class="score">${place.score}</span>
      <h3>${index+1}. ${escapeHtml(place.name)}</h3>
      <div class="meta">${place.distanceKm} km · ${place.categories.map(escapeHtml).join(", ")}</div>
      <div class="reason">${place.reasons.map(escapeHtml).join(" · ")}</div>
      <div style="margin-top:7px;font-size:12px">
        <a href="${escapeHtml(place.osm)}" target="_blank" rel="noreferrer">OpenStreetMap ↗</a>
      </div>
    </div>`;
  }).join("") || "<div class='card'>No mapped places found nearby.</div>";
}

async function runSearch(){
  goButton.disabled=true;
  statusEl.textContent="Understanding your request…";
  intentEl.innerHTML="";
  resultsEl.innerHTML="";

  try{
    const searchLocation=await getSearchLocation();
    const userQuery=queryInput.value.trim();

    if(!userQuery) throw new Error("Tell Mappy what you're looking for.");

    map.setView(searchLocation,13);
    statusEl.textContent="Finding a broad candidate set…";

    const response=await fetch("/api/search",{
      method:"POST",
      headers:{"content-type":"application/json"},
      body:JSON.stringify({
        query:userQuery,
        lat:searchLocation[0],
        lon:searchLocation[1]
      })
    });

    let data;
    try{ data=await response.json(); }
    catch{ throw new Error("Mappy returned an invalid response."); }

    if(!response.ok) throw new Error(data.error||"Search failed.");

    renderResults(data,searchLocation);
  }catch(error){
    console.error("Mappy search error:",error);
    statusEl.textContent=error?.message||"Something went wrong.";
  }finally{
    goButton.disabled=false;
  }
}

goButton.addEventListener("click",runSearch);
queryInput.addEventListener("keydown",event=>{
  if((event.ctrlKey||event.metaKey)&&event.key==="Enter") runSearch();
});
</script></body></html>
